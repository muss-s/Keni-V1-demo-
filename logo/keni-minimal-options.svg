<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 800" width="1200" height="800" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b6cff"/><stop offset="1" stop-color="#ff8fc8"/>
    </linearGradient>

    <!-- the word "keni", drawn with one even line. Box: x -5..163, y -35..45 -->
    <g id="word-base" fill="none" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 -24V40M2 24 24 2M11 15 27 40"/>
      <path d="M42 20H82A20 20 0 1 0 76.1 34.1"/>
      <path d="M98 40V0M98 18A18 18 0 0 1 134 18V40"/>
      <path d="M152 5V40"/>
    </g>

    <!-- 1 · Here: a pin standing on a stem (the letter i, and a person at a place) -->
    <symbol id="i1" viewBox="0 0 120 120">
      <path d="M60 68V98" fill="none" stroke="currentColor" stroke-width="12" stroke-linecap="round"/>
      <path d="M60 58C52 46 43 41 43 30A17 17 0 1 1 77 30C77 41 68 46 60 58Z" fill="url(#g)"/>
      <circle cx="60" cy="30" r="6" fill="var(--hole, #120c26)"/>
    </symbol>
    <!-- 2 · k dot: the letter k and a "you are here" dot -->
    <symbol id="i2" viewBox="0 0 120 120">
      <path d="M40 24V96M42 76 68 50M53 65 74 96" fill="none" stroke="currentColor" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="84" cy="32" r="9" fill="url(#g)"/>
    </symbol>
    <!-- 3 · Heart pin: a heart that comes to a point like a map pin ("your next favorite spot") -->
    <symbol id="i3" viewBox="0 0 120 120">
      <path d="M60 102C30 76 20 60 20 45A20 20 0 0 1 60 41A20 20 0 0 1 100 45C100 60 90 76 60 102Z" fill="url(#g)"/>
      <circle cx="60" cy="52" r="8" fill="var(--hole, #120c26)"/>
    </symbol>
  </defs>

  <rect width="1200" height="800" fill="#0d0919"/>
  <text x="60" y="64" fill="#f6f1ff" font-size="26" font-weight="700">Keni · minimalist logo options</text>
  <text x="60" y="94" fill="#9a8fc0" font-size="15">“Keni” means “here” in Kapampangan, so each one is built around a “here” mark.</text>

  <!-- ───────── option 1 ───────── -->
  <g transform="translate(60 130)">
    <text y="0" fill="#c4b0ff" font-size="15" font-weight="700" letter-spacing="2">1 · HERE</text>
    <rect y="22" width="150" height="150" rx="34" fill="#120c26" stroke="#2a2148"/>
    <use xlink:href="#i1" href="#i1" x="15" y="37" width="120" height="120" color="#f6f1ff"/>
    <rect x="170" y="22" width="150" height="150" rx="34" fill="#f6f1ff"/>
    <use xlink:href="#i1" href="#i1" x="185" y="37" width="120" height="120" color="#1a1233" style="--hole:#f6f1ff"/>
    <!-- wordmark: the dot of the i is the pin -->
    <g transform="translate(14 262) scale(1.55)">
      <use xlink:href="#word-base" href="#word-base" stroke="#f6f1ff"/>
      <path d="M152 -5C147 -12 142 -17 142 -24A10 10 0 1 1 162 -24C162 -17 157 -12 152 -5Z" fill="url(#g)"/>
      <circle cx="152" cy="-24" r="3.6" fill="#0d0919"/>
    </g>
    <text y="372" fill="#9a8fc0" font-size="14">A pin on a stem: the letter i,</text>
    <text y="392" fill="#9a8fc0" font-size="14">and a person standing at a place.</text>
  </g>

  <!-- ───────── option 2 ───────── -->
  <g transform="translate(440 130)">
    <text y="0" fill="#c4b0ff" font-size="15" font-weight="700" letter-spacing="2">2 · K DOT</text>
    <rect y="22" width="150" height="150" rx="34" fill="#120c26" stroke="#2a2148"/>
    <use xlink:href="#i2" href="#i2" x="15" y="37" width="120" height="120" color="#f6f1ff"/>
    <rect x="170" y="22" width="150" height="150" rx="34" fill="#f6f1ff"/>
    <use xlink:href="#i2" href="#i2" x="185" y="37" width="120" height="120" color="#1a1233"/>
    <g transform="translate(14 262) scale(1.55)">
      <use xlink:href="#word-base" href="#word-base" stroke="#f6f1ff"/>
      <circle cx="152" cy="-14" r="6.5" fill="url(#g)"/>
    </g>
    <text y="372" fill="#9a8fc0" font-size="14">The letter k with a “you are here” dot.</text>
    <text y="392" fill="#9a8fc0" font-size="14">The simplest, and easy to read tiny.</text>
  </g>

  <!-- ───────── option 3 ───────── -->
  <g transform="translate(820 130)">
    <text y="0" fill="#c4b0ff" font-size="15" font-weight="700" letter-spacing="2">3 · HEART PIN</text>
    <rect y="22" width="150" height="150" rx="34" fill="#120c26" stroke="#2a2148"/>
    <use xlink:href="#i3" href="#i3" x="15" y="37" width="120" height="120"/>
    <rect x="170" y="22" width="150" height="150" rx="34" fill="#f6f1ff"/>
    <use xlink:href="#i3" href="#i3" x="185" y="37" width="120" height="120" style="--hole:#f6f1ff"/>
    <g transform="translate(14 262) scale(1.55)">
      <use xlink:href="#word-base" href="#word-base" stroke="#f6f1ff"/>
      <path d="M152 -6C144 -13 141 -17 141 -21A5.5 5.5 0 0 1 152 -22A5.5 5.5 0 0 1 163 -21C163 -17 160 -13 152 -6Z" fill="url(#g)"/>
    </g>
    <text y="372" fill="#9a8fc0" font-size="14">A heart that ends in a pin point:</text>
    <text y="392" fill="#9a8fc0" font-size="14">“your next favorite spot.”</text>
  </g>

  <!-- how each looks very small, like a phone home-screen icon or a browser tab -->
  <g transform="translate(60 590)">
    <text y="0" fill="#c4b0ff" font-size="15" font-weight="700" letter-spacing="2">AT SMALL SIZES</text>
    <g transform="translate(0 22)">
      <rect width="64" height="64" rx="15" fill="#120c26" stroke="#2a2148"/><use xlink:href="#i1" href="#i1" x="8" y="8" width="48" height="48" color="#f6f1ff"/>
      <rect x="80" width="36" height="36" rx="9" fill="#120c26" stroke="#2a2148"/><use xlink:href="#i1" href="#i1" x="84" y="4" width="28" height="28" color="#f6f1ff"/>
      <rect x="130" width="22" height="22" rx="6" fill="#120c26" stroke="#2a2148"/><use xlink:href="#i1" href="#i1" x="132" y="2" width="18" height="18" color="#f6f1ff"/>
    </g>
    <g transform="translate(380 22)">
      <rect width="64" height="64" rx="15" fill="#120c26" stroke="#2a2148"/><use xlink:href="#i2" href="#i2" x="8" y="8" width="48" height="48" color="#f6f1ff"/>
      <rect x="80" width="36" height="36" rx="9" fill="#120c26" stroke="#2a2148"/><use xlink:href="#i2" href="#i2" x="84" y="4" width="28" height="28" color="#f6f1ff"/>
      <rect x="130" width="22" height="22" rx="6" fill="#120c26" stroke="#2a2148"/><use xlink:href="#i2" href="#i2" x="132" y="2" width="18" height="18" color="#f6f1ff"/>
    </g>
    <g transform="translate(760 22)">
      <rect width="64" height="64" rx="15" fill="#120c26" stroke="#2a2148"/><use xlink:href="#i3" href="#i3" x="8" y="8" width="48" height="48"/>
      <rect x="80" width="36" height="36" rx="9" fill="#120c26" stroke="#2a2148"/><use xlink:href="#i3" href="#i3" x="84" y="4" width="28" height="28"/>
      <rect x="130" width="22" height="22" rx="6" fill="#120c26" stroke="#2a2148"/><use xlink:href="#i3" href="#i3" x="132" y="2" width="18" height="18"/>
    </g>
  </g>
</svg>
